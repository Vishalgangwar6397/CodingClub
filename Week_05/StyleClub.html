<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Coding Club</title>
    <style>
        /* Variables: change a colour here and it changes everywhere */
       :root {
            --brand: #0f766e;
            --light: #f59e0b;
            --dark: #1e293b;
            --gap: 24px;
          }
          
        /* * = every element */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #eef2ff;
            color: #263238;
            line-height: 1.6;
            padding: 24px;
        }
       /* Header */
       header {
            background:#4338ca ; 
            color: White;
            text-align: center;
            padding: 45px 20px;
            border-radius: 15px;
       }

        /* h1 = element selector */
       header h1 {
            font-size: 35px;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }
        header p {
              font-size: 17px ;
        }

        /* #hero = id selector (only one on the page) */
        #hero {
            background: #4338ca;
            color: white;
            text-align: center;
            padding: 64px var(--gap);
            border-radius: 32px;
        }

        /* .card = class selector (use many times) */
        .card {
            background: white;
            padding: 25px; 
            margin-top: 25px;
            border-radius: 13px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
           /* margin-top: 8px;*/
        }

        th {
            background: #4338ca;
            color: white;
            text-align: left;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        input {
            padding: 6px;
            margin: 4px 0;
        }

        button {
            background: #4338ca;
            color: white;
            border: none;
            padding: 13px 24px;
            border-radius: 6px;
            font-size: 16px;
            cursor:pointer;
        }
        button:hover {
            background: #312e81;
        }
        footer {
            text-align: center;
            padding: 20px;
            margin-top: 20px ;
            color: #555;
        }
    </style>
</head>

<body>
    <div id="hero">
        <h1>Coding Club</h1>
        <p>Learn coding . Build projects . Share Ideas.</p>
    </div>
    <div class="card">
        <h2>Upcoming Events</h2>
        <table>
            <tr>
                <th>Event</th>
                <th>Date</th>
                <th>Venue</th>
            </tr>
            <tr>
                <td>HTML Workshop</td>
                <td>18 Dec</td>
                <td>Lab 5 </td>
            </tr>
            <tr>
                <td>CSS Competition</td>
                <td>19 Dec</td>
                <td>Lab 2</td>
            </tr>
            <tr>
                <td>Pubg Competition</td>
                <td>25 Dec</td>
                <td>Lab 5</td>
             </tr>
        </table>
    </div>
    <div class="card">
        <h2>Join Our Club</h2>
        <form>
        <p>Your Name: <input type="text" placeholder="Enter your name"></p>
        <p>Email Address: <input type="email" placeholder="Enter your email"></p>
        <button>Register Now</button> 
        </form>
    </div>
    <footer>
      <p>2026 Coding Club . All Rights Reserved</p>
    </footer>
</body>

</html>
